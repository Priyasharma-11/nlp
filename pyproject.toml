[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "researchmind"
version = "0.9.0"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.42,<2", "SQLAlchemy>=2.0,<2.1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "PyMuPDF>=1.26,<2", "numpy>=1.26,<3", "pandas>=2,<3", "scikit-learn>=1.5,<2", "nltk>=3.9,<4", "spacy>=3.8,<4", "networkx>=3.2,<4", "plotly>=5.24,<7"]
[project.optional-dependencies]
ai = ["torch>=2.4,<3", "sentence-transformers>=3.4,<6", "transformers>=4.48,<5"]
word2vec = ["gensim>=4.4,<5"]
specter = ["adapters>=1.1,<2"]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
